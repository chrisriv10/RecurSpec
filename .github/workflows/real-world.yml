name: Real-world compatibility

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

jobs:
  real-world:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Real-world compatibility suite
        run: pnpm test:real-world
